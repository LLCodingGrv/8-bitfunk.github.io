<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8-bit Funk - Home</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Permanent+Marker&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />

    <style>
        body{
            display:flex;
            flex-direction:column;
            min-height:100vh;
            margin:0;
            font-family:'Press Start 2P',cursive;
            background:linear-gradient(to bottom,#4B0082 40%,#121212 60%);
            color:#f5f5f5;
            text-align:center;
        }

        nav{
            display:flex;
            justify-content:center;
            background-color:#4B0082;
            padding:15px;
            position:relative;
            z-index:1;
        }

        nav a{
            color:#D8BFD8;
            text-decoration:none;
            margin:0 20px;
            font-size:20px;
            font-weight:bold;
        }

        nav a:hover{
            color:#BA55D3;
            text-decoration:underline;
        }

        header{
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            height:320px;
            background:transparent;
            padding-top:50px;
        }

        .logo{
            max-width:50%;
            height:auto;
        }

        main{
            flex:1;
            display:flex;
            flex-direction:column;
            align-items:center;
            padding:40px 20px;
            gap:35px;
        }

        /* Album announcement */

        .album-announcement{
            width:100%;
            max-width:900px;
            text-align:center;
        }

        .album-announcement img{
            width:100%;
            max-width:500px;
            border-radius:12px;
            box-shadow:0 0 20px rgba(216,191,216,.35);
        }

        .album-announcement h2{
            font-family:'Permanent Marker',cursive;
            color:#D8BFD8;
            font-size:2rem;
            margin:0 0 20px;
        }

        .album-announcement p{
            font-family:'Permanent Marker',cursive;
            color:#ffffff;
            font-size:1.4rem;
            line-height:1.5;
            margin-top:20px;
        }

        /* Videos */

        .video-container{
            width:100%;
            max-width:800px;
        }

        .video-container iframe{
            width:100%;
            height:450px;
            border:none;
            border-radius:10px;
        }

        footer{
            background:#4B0082;
            color:#D8BFD8;
            text-align:center;
            padding:15px;
            font-weight:bold;
            margin-top:auto;
        }

        @media (max-width:768px){

            .logo{
                max-width:95% !important;
            }

            .album-announcement img{
                max-width:90%;
            }

            .album-announcement h2{
                font-size:1.5rem;
            }

            .album-announcement p{
                font-size:1.15rem;
            }

            .video-container iframe{
                height:260px;
            }
        }

    </style>
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="tour.html">Tour</a>
        <a href="contact.html">Contact</a>
    </nav>

    <header>
        <img src="images/8-bit_Funk_Logo.png" alt="8-bit Funk Logo" class="logo" />
    </header>

    <main>

        <div class="album-announcement">
            <h2>Coming Soon</h2>

            <img src="images/LevelDesignArtwork.png" alt="Level Design Album Artwork">

            <p>
                Debut album <strong>"Level Design"</strong><br>
                Releasing this year.<br>
                Release date to be announced.
            </p>
        </div>

        <div class="video-container">
            <iframe
                src="https://www.youtube.com/embed/kHCyqOQloE8"
                title="8-bit Funk Video 1"
                allowfullscreen>
            </iframe>
        </div>

        <div class="video-container">
            <iframe
                src="https://www.youtube.com/embed/AOlqTB4Sdw4"
                title="8-bit Funk Video 2"
                allowfullscreen>
            </iframe>
        </div>

    </main>

    <footer>
        <p>© 2025 8-bit Funk. All rights reserved.</p>
    </footer>

</body>
</html>
